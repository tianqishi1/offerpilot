<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OfferPilot 职航</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; font-size: 13px; }
    h1 { font-size: 15px; }
    button { margin: 4px 4px 4px 0; padding: 6px 10px; }
    textarea { width: 100%; height: 120px; font-family: monospace; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    td, th { border: 1px solid #ddd; padding: 4px; font-size: 12px; }
    .g { background: #e8f5e9; } .y { background: #fff8e1; } .r { background: #ffebee; }
    #status { padding: 6px; background: #f5f5f5; margin: 6px 0; }
    #verify { padding: 8px; margin: 6px 0; font-weight: bold; }
    #log { white-space: pre-wrap; font-size: 11px; color: #555; max-height: 160px; overflow: auto; }
  </style>
</head>
<body>
  <h1>OfferPilot · 职航 (dev)</h1>
  <div id="status">未连接。打开一个网申页面，点「1 授权并识别」。</div>
  <div>API: <input id="api" value="http://127.0.0.1:8787" size="28" /></div>
  <details><summary>演示画像（JSON，可编辑）</summary><textarea id="profile"></textarea></details>
  <div>
    <button id="btn-detect">1 授权并识别</button>
    <button id="btn-fill" disabled>2 生成计划并填写</button>
    <button id="btn-submit" disabled>3 确认提交</button>
  </div>
  <div id="verify"></div>
  <table id="fields"><thead><tr><th>字段</th><th>类型</th><th>来源</th><th>置信度</th><th>状态</th></tr></thead><tbody></tbody></table>
  <div id="log"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
