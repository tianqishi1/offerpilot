<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>演示公司 2027 校招网申</title>
<style>body{font-family:system-ui;max-width:640px;margin:40px auto}label{display:block;margin:10px 0 2px}input,textarea,select{width:100%;padding:6px}#dropzone{border:2px dashed #aaa;padding:16px;margin:8px 0}[hidden]{display:none}</style>
</head>
<body>
<h1>演示公司 · 2027 校园招聘网申</h1>
<form id="apply-form">
  <div id="page1">
    <label for="name">姓名 <span style="color:#d32f2f;font-weight:bold">*</span></label><input id="name" name="name" type="text" required />
    <label for="school">学校 <span style="color:#d32f2f;font-weight:bold">*</span></label><input id="school" name="school" type="text" required />
    <label for="major">专业</label><input id="major" name="major" type="text" />
    <button id="next" type="button">下一步</button>
  </div>
  <div id="page2" hidden>
    <label for="intro">自我介绍</label><textarea id="intro" name="intro"></textarea>
    <span id="city-label">期望城市</span>
    <input id="city-input" role="combobox" aria-labelledby="city-label" aria-controls="city-list" autocomplete="off" />
    <ul id="city-list" role="listbox" hidden><li id="opt-bj" role="option">北京</li><li id="opt-sh" role="option">上海</li><li id="opt-sz" role="option">深圳</li></ul>
    <label><input id="agree" name="agree" type="checkbox" /> 同意招聘条款</label>
    <label for="salary">期望薪资</label><input id="salary" name="salary" type="text" />
    <label for="why">为什么选择我们</label><textarea id="why" name="why"></textarea>
    <label for="resume">附件简历</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" />
    <div id="dropzone" data-dropzone>拖拽简历到此处</div>
    <button id="submit" type="button">提交申请</button>
  </div>
</form>
<script>
// React 受控组件语义模拟（与 executor 测试夹具一致）
function trackControlled(input, initial) {
  let state = initial || '', trackerValue = initial || '';
  const proto = input.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
  const desc = Object.getOwnPropertyDescriptor(proto, 'value');
  input._valueTracker = { getValue: () => trackerValue, setValue: v => { trackerValue = String(v); } };
  Object.defineProperty(input, 'value', { configurable: true, get() { return desc.get.call(this); }, set(v) { trackerValue = String(v); desc.set.call(this, v); } });
  input.addEventListener('input', () => {
    const current = desc.get.call(input);
    if (trackerValue === current) { desc.set.call(input, state); trackerValue = state; return; }
    state = current; trackerValue = current;
    input.dispatchEvent(new Event('change', { bubbles: true }));
  });
}
['name','school','major','intro','salary','why'].forEach(id => trackControlled(document.getElementById(id), ''));
// combobox
const ci = document.getElementById('city-input'), cl = document.getElementById('city-list');
const opts = Array.from(cl.querySelectorAll('li'));
ci.addEventListener('input', () => { const q = ci.value.trim(); let any = false; opts.forEach(li => { const show = !q || li.textContent.includes(q); li.hidden = !show; any = any || show; }); cl.hidden = !any; });
opts.forEach(li => li.addEventListener('click', () => { ci.value = li.textContent.trim(); ci.setAttribute('aria-activedescendant', li.id); cl.hidden = true; ci.dispatchEvent(new Event('change', { bubbles: true })); }));
// upload
const ri = document.getElementById('resume');
ri.addEventListener('change', () => { document.getElementById('dropzone').textContent = '已选择: ' + (ri.files[0] ? ri.files[0].name : ''); });
// multipage + submit
document.getElementById('next').addEventListener('click', () => { document.getElementById('page1').hidden = true; document.getElementById('page2').hidden = false; });
document.getElementById('submit').addEventListener('click', () => {
  document.getElementById('apply-form').remove();
  const done = document.createElement('div'); done.id = 'done'; done.textContent = '提交成功，申请已收到！请留意邮件通知。';
  document.body.appendChild(done);
  location.hash = '#/success';
});
</script>
</body>
</html>
